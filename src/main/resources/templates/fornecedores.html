<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS - Fornecedores</title>
    <link rel="stylesheet" th:href="@{css/global.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="area-logo">
            <a th:href="@{/dashboard}">
                <img th:src="@{/images/InventorySystem.Logo_white.png}" alt="IS Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <div class="nav-links">
                <a th:href="@{/dashboard}">Home</a>
                <a th:href="@{/produtos}">Produtos</a>
                <a th:href="@{/fornecedores}" class="active">Fornecedores</a>
                <a th:href="@{/movimentacoes}">Movimentações</a>
            </div>
            <div class="user-controls">

                <div class="vertical-divider"></div>

                <a th:href="@{/index}" class="btn-sair">
                    SAIR
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
                <label class="theme-switch">
                    <input type="checkbox" id="checkbox-theme">
                    <span class="slider">
                        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span>
                </label>
            </div>
        </nav>
    </header>
    <main>
        <section class="top-fixed-content">
            <div class="page-header">
                <h1>Fornecedores</h1>
            </div>
            <div class="filter-bar">
                <form class="search-group">
                    <div class="input-wrapper small">
                        <label>ID</label>
                        <input type="number" class="filter-input">
                    </div>
                    <div class="input-wrapper">
                        <label>Nome</label>
                        <input type="text" class="filter-input">
                    </div>
                    <div class="input-wrapper">
                        <label>Telefone</label>
                        <input type="number" class="filter-input">
                    </div>
                    <div class="button-group">
                        <button type="button" class="btn-limpar">Limpar</button>
                        <a th:href="@{/cadastro-fornecedores}" class="btn-padrao">+ Novo fornecedor</a>
                    </div>
                </form>
            </div>
        </section>
        <section class="table-content-scroll">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome fornecedor</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>CNPJ</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fornecedor : ${listaFornecedores}">
                        <td th:text="${fornecedor.id}">1</td>
                        <td th:text="${fornecedor.razaoSocial}">Fornecedor A</td>
                        <td th:text="${fornecedor.email}">fornecedorA@email.com</td>
                        <td th:text="${fornecedor.telefone}">(11) 9999-8888</td>
                        <td th:text="${fornecedor.cnpj}">12.345.678/0001-90</td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="${fornecedor.ativo ? 'status-ativo' : 'status-descontinuado'}"
                                  th:text="${fornecedor.ativo ? 'Contrato Ativo' : 'Contrato Encerrado'}">
                                Contrato Ativo
                            </span>
                        </td>
                        <td class="actions">
                            <a th:href="@{/visualizar-fornecedor(id=${fornecedor.id})}" class="btn-action btn-view" title="Visualizar Detalhes">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaFornecedores)}">
                        <td colspan="7" style="text-align: center; padding: 2rem; color: #666;">
                            Nenhum fornecedor cadastrado no banco de dados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
