<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory System</title>
    <link rel="stylesheet" th:href="@{css/global.css}">
    <link rel="stylesheet" th:href="@{css/login.css}">
</head>
<body class="body-login">
    <main class="login-container">
        <div class="login-card">
            <h1>Login</h1>
            <div th:if="${param.error}" class="alert alert-danger" style="color: #c62828; text-align: center; margin-bottom: 15px; font-weight: bold;">
                E-mail ou senha incorretos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" style="color: #2e7d32; text-align: center; margin-bottom: 15px; font-weight: bold;">
                Você saiu do sistema com sucesso.
            </div>
            <form th:action="@{/login}" method="POST">
                <div class="input-group">
                    <label for="username">E-mail:</label>
                    <input type="email" id="username" name="username" class="valida-email" placeholder="usuario@gmail.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" placeholder="********" minlength="6" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <a th:href="@{/recuperar-senha}" class="link-esqueci">Esqueci minha senha</a>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 - Sistema de Gerenciamento de Estoques. Todos os direitos reservados.</p>
        <p>Contato: viniciuscharles3101@gmail.com</p>
    </footer>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
</body>
</html>
