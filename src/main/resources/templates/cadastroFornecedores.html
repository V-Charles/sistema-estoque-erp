<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS - Cadastro de Fornecedores</title>
    <link rel="stylesheet" th:href="@{css/global.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="body-scroll">
    <header>
    <div id="area-logo">
        <a th:href="@{/dashboard}">
            <img th:src="@{/images/InventorySystem.Logo-light-mod1.png}" alt="IS Logo" class="logo-img">
        </a>
    </div>
    <nav>
        <div class="nav-links">
            <a th:href="@{/dashboard}">Home</a>
            <a th:href="@{/produtos}">Produtos</a>
            <a th:href="@{/fornecedores}" class="active">Fornecedores</a>
            <a th:href="@{/movimentacoes}">Movimentações</a>
        </div>
        <div class="user-controls">

            <div class="vertical-divider"></div>

            <a th:href="@{/index}" class="btn-sair">
                SAIR
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </a>
            <label class="theme-switch">
                <input type="checkbox" id="checkbox-theme">
                <span class="slider">
                        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span>
            </label>
        </div>
    </nav>
    </header>
    <main>
        <div class="page-content">
            <div class="page-header">
                <h1>Novo Fornecedor</h1>
            </div>
            <section class="form-card">
                <form th:action="@{/fornecedores/salvar}" method="POST" th:object="${fornecedor}">
                    <div class="form-grid">
                        <div class="form-column">
                            <div class="input-wrapper">
                                <label for="nome-fornecedor">Nome do Fornecedor</label>
                                <input type="text" id="nome-fornecedor" th:field="*{razaoSocial}" class="form-input" required>
                            </div>
                            <div class="input-wrapper">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" th:field="*{email}" class="form-input valida-email" placeholder="contato@empresa.com" required>
                            </div>
                            <div class="input-wrapper">
                                <label for="telefone">Telefone</label>
                                <input type="text" id="telefone" th:field="*{telefone}" class="form-input mask-telefone valida-telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                            </div>
                        </div>

                        <div class="form-column">
                            <div class="input-wrapper">
                                <label for="cnpj">CNPJ</label>
                                <input type="text" id="cnpj" th:field="*{cnpj}" class="form-input mask-cnpj valida-cnpj" placeholder="00.000.000/0000-00" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a th:href="@{/fornecedores}" class="btn-padrao">Cancelar cadastro</a>
                        <button type="submit" class="btn-padrao">Salvar cadastro</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/masks.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
</body>
</html>
