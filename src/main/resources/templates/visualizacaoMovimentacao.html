<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS - Visualizar Movimentação</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="area-logo">
            <a th:href="@{/dashboard}">
                <img th:src="@{/images/InventorySystem.Logo_white.png}" alt="IS Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <div class="nav-links">
                <a th:href="@{/dashboard}">Home</a>
                <a th:href="@{/produtos}">Produtos</a>
                <a th:href="@{/fornecedores}">Fornecedores</a>
                <a th:href="@{/movimentacoes}" class="active">Movimentações</a>
            </div>
            <div class="user-controls">

                <div class="vertical-divider"></div>

                <a th:href="@{/index}" class="btn-sair">
                    SAIR
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
                <label class="theme-switch">
                    <input type="checkbox" id="checkbox-theme">
                    <span class="slider">
                        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span>
                </label>
            </div>
        </nav>
    </header>
    <main>
        <div class="page-content">
            <div class="page-header">
                <h1>Visualização de Movimentação</h1>
            </div>
            <section class="form-card">
                <div class="form-grid">
                    <div class="form-column">
                        <div class="input-wrapper">
                            <label for="nome-produto">Nome do Produto</label>
                            <input type="text" id="nome-produto" class="form-input" th:value="${movimentacao.produto.nome}" readonly>
                        </div>
                        <div class="input-wrapper">
                            <label for="nome-fornecedor">Nome do Fornecedor</label>
                            <input type="text" id="nome-fornecedor" class="form-input" th:value="${movimentacao.produto.fornecedor.razaoSocial}" readonly>
                        </div>
                        <div class="input-wrapper">
                            <label for="tipo-movimentacao">Tipo de movimentação</label>
                            <input type="text" id="tipo-movimentacao" class="form-input" th:value="${movimentacao.tipoMovimentacao}" readonly style="font-weight: bold;">
                        </div>
                        <div class="input-wrapper">
                            <label for="valor-unitario">Valor Unitário Referência</label>
                            <div class="input-with-prefix">
                                <span>R$</span>
                                <input type="text" id="valor-unitario" class="form-input"
                                       th:value="${movimentacao.tipoMovimentacao.name() == 'ENTRADA' ? #numbers.formatDecimal(movimentacao.produto.precoCusto, 1, 'POINT', 2, 'COMMA') : (movimentacao.tipoMovimentacao.name() == 'SAIDA' ? #numbers.formatDecimal(movimentacao.produto.precoVenda, 1, 'POINT', 2, 'COMMA') : '0,00')}"
                                       readonly>
                            </div>
                        </div>
                        <div class="input-wrapper">
                            <label for="data-movimentacao">Data/Hora da movimentação</label>
                            <input type="text" id="data-movimentacao" class="form-input" th:value="${#temporals.format(movimentacao.dataHora, 'dd/MM/yyyy HH:mm')}" readonly>
                        </div>
                    </div>
                    <div class="form-column">
                        <div class="input-wrapper full-width">
                            <label for="observacao">Observação</label>
                            <textarea id="observacao" class="form-input" rows="5" th:text="${movimentacao.observacao}" readonly></textarea>
                        </div>
                        <div class="input-wrapper">
                            <label for="nome-usuario">Usuário responsável</label>
                            <input type="text" id="nome-usuario" class="form-input" th:value="${movimentacao.usuario.nome}" readonly>
                        </div>
                        <div class="input-wrapper">
                            <label for="quantidade-movimentada">Quantidade movimentada</label>
                            <input type="text" id="quantidade-movimentada" class="form-input" th:value="${movimentacao.quantidade}" readonly>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <a th:href="@{/movimentacoes}" class="btn-padrao">Voltar</a>
                </div>
            </section>
        </div>
    </main>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
