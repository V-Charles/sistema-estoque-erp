<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS - Produtos</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="area-logo">
            <a th:href="@{/dashboard}">
                <img th:src="@{/images/InventorySystem.Logo_white.png}" alt="IS Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <div class="nav-links">
                <a th:href="@{/dashboard}">Home</a>
                <a th:href="@{/produtos}" class="active">Produtos</a>
                <a th:href="@{/fornecedores}">Fornecedores</a>
                <a th:href="@{/movimentacoes}">Movimentações</a>
            </div>
            <div class="user-controls">

                <div class="vertical-divider"></div>

                <a th:href="@{/index}" class="btn-sair">
                    SAIR
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
                <label class="theme-switch">
                    <input type="checkbox" id="checkbox-theme">
                    <span class="slider">
                        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span>
                </label>
            </div>
        </nav>
    </header>
    <main>
        <section class="top-fixed-content">
            <div class="page-header">
                <h1>Produtos</h1>
            </div>
            <div class="filter-bar">
                <form class="search-group" th:action="@{/produtos}" method="GET">
                    <div class="input-wrapper small">
                        <label>ID</label>
                        <input type="number" class="filter-input" disabled placeholder="...">
                    </div>
                    <div class="input-wrapper">
                        <label>Nome</label>
                        <input type="text" name="nomeBusca" class="filter-input" th:value="${nomeBusca}">
                    </div>
                    <div class="input-wrapper">
                        <label>Categoria</label>
                        <select class="filter-input" disabled>
                            <option>Em breve...</option>
                        </select>
                    </div>
                    <div class="button-group">
                        <a th:href="@{/produtos}" class="btn-limpar" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">Limpar</a>

                        <a th:href="@{/cadastro-produtos}" class="btn-padrao">+ Novo produto</a>
                        <button type="submit" style="display: none;"></button>
                    </div>
                </form>
            </div>
        </section>
        <section class="table-content-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Fornecedor</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="tabelaProdutos" th:fragment="tabelaProdutos">
                    <tr th:each="produto : ${listaProdutos}">
                        <td th:text="${produto.id}">1</td>
                        <td th:text="${produto.nome}">Teclado Mecânico</td>
                        <td th:text="${produto.categoria.descricao}">Periféricos</td>
                        <td th:text="${produto.fornecedor.razaoSocial}">World Tech</td>
                        <td th:text="${produto.quantidadeTotalEstoque}">32</td>
                        <td th:text="|R$ ${#numbers.formatDecimal(produto.precoVenda, 1, 'POINT', 2, 'COMMA')}|">R$ 8.000,00</td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="${produto.status.classeCss}"
                                  th:text="${produto.status.descricao}">
                                Ativo
                            </span>
                        </td>
                        <td class="actions">
                            <a th:href="@{/visualizar-produto(id=${produto.id})}" class="btn-action btn-view" title="Visualizar Detalhes">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </a>
                            <a th:href="@{/registra-movimentacao(produtoId=${produto.id})}" class="btn-action btn-movi" title="Registrar Movimentação">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaProdutos)}">
                        <td colspan="8" style="text-align: center; padding: 2rem; color: #666;">
                            Nenhum produto cadastrado no banco de dados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/filtros.js}"></script>
</body>
</html>
