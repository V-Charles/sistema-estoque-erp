<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS - Detalhes do Produto</title>
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="area-logo">
            <a href="dashboard.html">
                <img src="images/InventorySystem.png 1.svg" alt="IS Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <div class="nav-links">
                <a href="dashboard.html">Home</a>
                <a href="produtos.html" class="active">Produtos</a>
                <a href="fornecedores.html">Fornecedores</a>
                <a href="movimentacoes.html">Movimentações</a>
            </div>
            <div class="user-controls">

                <div class="vertical-divider"></div>

                <a href="index.html" class="btn-sair">
                    SAIR
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
                <label class="theme-switch">
                    <input type="checkbox" id="checkbox-theme">
                    <span class="slider">
                            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        </span>
                </label>
            </div>
        </nav>
    </header>
    <main>
        <div class="page-content">
            <div class="page-header">
                <h1>Visualização e Edição de produtos</h1>
            </div>
            <div class="product-view-layout">
                <div class="form-card">
                    <div class="product-form-grid">
                        <div class="input-group">
                            <label>Nome do produto</label>
                            <div class="editable-field">
                                <input class="form-input" value="Teclado Mecânico">
                                <a href="#" class="edit-icon" title="Editar">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </a>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Valor Unitário</label>
                            <div class="editable-field">
                                <div class="input-with-prefix">
                                    <span>RS</span>
                                    <input class="form-input" value="8.000,00">
                                </div>
                                <a href="#" class="edit-icon" title="Editar">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </a>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Valor de Custo</label>
                            <div class="editable-field">
                                <div class="input-with-prefix">
                                    <span>RS</span>
                                    <input class="form-input" value="6.000,00">
                                </div>
                                <a href="#" class="edit-icon" title="Editar">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </a>
                            </div>
                        </div>
                        <div class="input-group full-width">
                            <label>Descrição</label>
                            <div class="editable-field">
                                <textarea class="form-input">Teclado mecânico de alta qualidade</textarea>
                                <a href="#" class="edit-icon" title="Editar">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </a>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Data de cadastro</label>
                            <input class="form-input" value="15/06/2024" readonly>
                        </div>
                        <div class="input-group">
                            <label for="categoria">Categoria:</label>
                            <div class="editable-field">
                                <select id="categoria" name="categoria" class="form-input">
                                    <option value="">Selecione</option>
                                    <option value="Periféricos">Periféricos</option>
                                    <option value="Hardware">Hardware</option>
                                </select>
                                <a href="#" class="edit-icon" title="Editar">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </a>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="fornecedor">Fornecedor:</label>
                            <div class="editable-field">
                                <select id="fornecedor" name="fornecedor" class="form-input">
                                    <option value="">Selecione</option>
                                    <option value="World Tech">World Tech</option>
                                </select>
                                <a href="#" class="edit-icon" title="Editar">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </a>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Status atual:</label>
                            <div class="radio-group">
                                <label>
                                    <input type="radio" name="status" value="ativo" checked> Ativo
                                </label>
                                <label>
                                    <input type="radio" name="status" value="pausado"> Pausado
                                </label>
                                <label>
                                    <input type="radio" name="status" value="descontinuado"> Descontinuado
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn-padrao">Voltar</button>
                        <button class="btn-padrao">Salvar edição</button>
                    </div>
                </div>
                <div class="history-card">
                    <h2>Histórico de movimentações</h2>
                    <div class="history-table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tipo de movimentação</th>
                                    <th>Data da movimentação</th>
                                    <th>Responsável</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Entrada</td>
                                    <td>20/06/2024</td>
                                    <td>João Silva</td>
                                </tr>
                                <tr>
                                    <td>Saída</td>
                                    <td>25/06/2024</td>
                                    <td>Maria Oliveira</td>
                                </tr>
                                <tr>
                                    <td>Entrada</td>
                                    <td>30/06/2024</td>
                                    <td>Carlos Santos</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
